name: Native Windows checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ports_ref:
        description: 'Optional Ports candidate ref; empty uses the recorded submodule pin'
        default: ''
      sessions_ref:
        description: 'Optional SSH Sessions candidate ref; empty uses the recorded pin'
        default: ''
      package:
        description: 'Download released leaves and produce the parent ZIP'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: inputs.ports_ref != ''
        with:
          repository: brant92good/port-forward-tui
          ref: ${{ inputs.ports_ref }}
          path: apps/port-forward-tui
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: inputs.sessions_ref != ''
        with:
          repository: brant92good/ssh-session-tui
          ref: ${{ inputs.sessions_ref }}
          path: apps/ssh-session-tui
      - name: Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component clippy --component rustfmt
      - name: Format, compile and native contracts
        run: |
          cargo +1.94.0 fmt --package terminal-workspace --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.94.0 test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.94.0 clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build without changing any desktop settings
        shell: powershell
        run: ./scripts/build_native.ps1
      - name: Package exact released leaves
        if: inputs.package
        shell: powershell
        run: |
          $out = Join-Path $PWD 'artifacts\downloaded-leaves'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $ports = Join-Path $out 'ports-x86_64-pc-windows-msvc.zip'
          $ssh = Join-Path $out 'ssh-sessions-x86_64-pc-windows-msvc.exe'
          $files = Join-Path $out 'ssh-files-x86_64-pc-windows-msvc.exe'
          Invoke-WebRequest -UseBasicParsing 'https://github.com/brant92good/port-forward-tui/releases/download/v0.8.1/ports-x86_64-pc-windows-msvc.zip' -OutFile $ports
          $portSums = Join-Path $out 'ports-SHA256SUMS'
          Invoke-WebRequest -UseBasicParsing 'https://github.com/brant92good/port-forward-tui/releases/download/v0.8.1/SHA256SUMS' -OutFile $portSums
          $portHash = (([IO.File]::ReadAllText($portSums) -split "`n" | Where-Object { $_ -match '  ports-x86_64-pc-windows-msvc.zip\s*$' }) -split '\s+')[0]
          Invoke-WebRequest -UseBasicParsing 'https://github.com/brant92good/ssh-session-tui/releases/download/v0.7.0/ssh-sessions-x86_64-pc-windows-msvc.exe' -OutFile $ssh
          $sshSum = Join-Path $out 'ssh-sessions.sha256'
          Invoke-WebRequest -UseBasicParsing 'https://github.com/brant92good/ssh-session-tui/releases/download/v0.7.0/ssh-sessions-x86_64-pc-windows-msvc.exe.sha256' -OutFile $sshSum
          $sshHash = ([IO.File]::ReadAllText($sshSum).Trim() -split '\s+')[0]
          Invoke-WebRequest -UseBasicParsing 'https://github.com/brant92good/ssh-files/releases/download/v0.1.0/ssh-files-x86_64-pc-windows-msvc.exe' -OutFile $files
          $filesSum = Join-Path $out 'ssh-files.sha256'
          Invoke-WebRequest -UseBasicParsing 'https://github.com/brant92good/ssh-files/releases/download/v0.1.0/ssh-files-x86_64-pc-windows-msvc.exe.sha256' -OutFile $filesSum
          $filesHash = ([IO.File]::ReadAllText($filesSum).Trim() -split '\s+')[0]
          $sshLicense = Join-Path $out 'ssh-sessions-LICENSE.txt'
          $filesLicense = Join-Path $out 'ssh-files-LICENSE.txt'
          $filesNotices = Join-Path $out 'ssh-files-THIRD_PARTY_NOTICES.txt'
          Invoke-WebRequest -UseBasicParsing 'https://github.com/brant92good/ssh-session-tui/releases/download/v0.7.0/LICENSE.txt' -OutFile $sshLicense
          Invoke-WebRequest -UseBasicParsing 'https://github.com/brant92good/ssh-files/releases/download/v0.1.0/LICENSE.txt' -OutFile $filesLicense
          Invoke-WebRequest -UseBasicParsing 'https://github.com/brant92good/ssh-files/releases/download/v0.1.0/THIRD_PARTY_NOTICES.txt' -OutFile $filesNotices
          ./scripts/package-native.ps1 -PortsBundle $ports -PortsSha256 $portHash -SessionsBinary $ssh -SessionsSha256 $sshHash -SessionsLicense $sshLicense -FilesBinary $files -FilesSha256 $filesHash -FilesLicense $filesLicense -FilesNotices $filesNotices
      - name: Install the actual packaged ZIP twice in a temporary directory
        if: inputs.package
        run: |
          $env:WORKSPACE_TEST_BUNDLE = Join-Path $PWD 'artifacts\release\terminal-workspace-x86_64-pc-windows-msvc.zip'
          cargo +1.94.0 test --locked --test native_install -- --ignored
      - name: Captured first-save and restart outside hosted process jobs
        if: inputs.package
        run: |
          ./scripts/check-captured-save.ps1 -Bundle (Join-Path $PWD 'artifacts\release\terminal-workspace-x86_64-pc-windows-msvc.zip')
      - name: Retain capture diagnostics on failure
        if: always() && inputs.package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-capture-diagnostics
          path: |
            ${{ runner.temp }}/ports-capture-*/result.json
            ${{ runner.temp }}/ports-capture-*/stdout.log
            ${{ runner.temp }}/ports-capture-*/stderr.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.package
        with:
          name: terminal-workspace-x86_64-pc-windows-msvc
          path: |
            artifacts/release/terminal-workspace-x86_64-pc-windows-msvc.zip
            artifacts/release/terminal-workspace-x86_64-pc-windows-msvc.zip.sha256
