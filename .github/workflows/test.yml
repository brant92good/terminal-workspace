name: Windows checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - shell: powershell
        run: ./scripts/terminal_views.ps1 -Mode List
      - name: Download and prepare the bundle without desktop changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_bootstrap.py --revision ${{ github.sha }}
